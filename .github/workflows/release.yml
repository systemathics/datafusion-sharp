name: Release

on:
  push:
    tags: ['v*.*.*']

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  check:
    name: Run Checks
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  pack-build-native:
    name: Build Native
    needs: check
    strategy:
      matrix:
        include:
          # Linux x64
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
          
          # Linux ARM64
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04-arm

          # Windows x64
          - target: x86_64-pc-windows-msvc
            os: windows-2025

    
    runs-on: ${{ matrix.os }}
    
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          targets: ${{ matrix.target }}
          toolchain: 'stable'

      - name: Setup Protoc
        uses: arduino/setup-protoc@v3

      - name: Build Native Library
        working-directory: native
        run: cargo build --target ${{ matrix.target }} --profile release --lib

      - name: (Linux) Prepare Native Library Artifacts
        if: runner.os == 'Linux'
        run: |
          mkdir -p artifacts/native/target/${{ matrix.target }}/release/
          cp native/target/${{ matrix.target }}/release/*.so artifacts/native/target/${{ matrix.target }}/release/

      - name: (Windows) Prepare Native Library Artifacts
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts/native/target/${{ matrix.target }}/release/
          Copy-Item native/target/${{ matrix.target }}/release/*.dll artifacts/native/target/${{ matrix.target }}/release/
          
      - name: Upload Native Library as Artifacts
        uses: actions/upload-artifact@v6
        with:
          name: native-${{ matrix.target }}
          path: artifacts/**
          overwrite: true
          retention-days: 1

  pack:
    name: Pack NuGet
    needs: pack-build-native
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Download Artifacts
        uses: actions/download-artifact@v7
        with:
          path: ./
          merge-multiple: true
        
      - name: Pack DataFusionSharp NuGet Package
        run: dotnet pack src/DataFusionSharp/DataFusionSharp.csproj -c Release -p:BuildNativeLib=false -o ./packages

      - name: Pack DataFusionSharp.Data NuGet Package
        run: dotnet pack src/DataFusionSharp.Data/DataFusionSharp.Data.csproj -c Release -p:BuildNativeLib=false -o ./packages

      - name: Upload NuGet Package
        uses: actions/upload-artifact@v6
        with:
          name: nuget-package
          path: packages/*
          retention-days: 30
