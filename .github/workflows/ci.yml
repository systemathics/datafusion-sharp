name: CI

on:
  push:
    branches:
      - main
      - 'systemathics**'
    paths:
      - 'src/**'
      - 'native/**'
      - 'tests/**'
      - '.github/**'
  pull_request:
    branches:
      - main
  workflow_dispatch:
  workflow_call:
    outputs:
      check-passed:
        description: "Checks passed"
        value: ${{ jobs.check.outputs.status }}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  check:
    name: Check
    if: "!contains(github.event.head_commit.message, '[ci-skip]')"
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          components: clippy
          toolchain: 'stable'

      - name: Restore Rust Cargo Cache
        id: cache-rust-cargo
        uses: actions/cache/restore@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/target/
          key: ubuntu-22.04-cargo-${{ hashFiles('native/Cargo.toml') }}-${{ github.run_id }}
          restore-keys: |
            ubuntu-22.04-cargo-${{ hashFiles('native/Cargo.toml') }}
        continue-on-error: true

      - name: Setup Protoc
        uses: arduino/setup-protoc@v3

      - name: Run Build
        run: dotnet build -c Release

      - name: Run Test
        run: dotnet test --no-build -c Release -v n --logger 'console;verbosity=normal' --blame-crash --blame-crash-dump-type mini --results-directory TestResults
        timeout-minutes: 5

      - name: Upload Test Results
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: TestResults/
          retention-days: 7

      - name: Run Rust Cargo Clippy
        working-directory: native
        run: cargo clippy --release --all-targets --no-deps -- -D clippy::pedantic
      
      - name: Save Rust Cargo Cache
        uses: actions/cache/save@v5
        with:
          path: |
            ~/.cargo/bin/
            ~/.cargo/registry/index/
            ~/.cargo/registry/cache/
            ~/.cargo/git/db/
            native/target/
          key: ubuntu-22.04-cargo-${{ hashFiles('native/Cargo.toml') }}-${{ github.run_id }}
        continue-on-error: true
