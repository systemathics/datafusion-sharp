# musl targets link the C runtime statically by default, which rules out a cdylib: link it dynamically, against the system's musl
[target.x86_64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]

[target.aarch64-unknown-linux-musl]
rustflags = ["-C", "target-feature=-crt-static"]
